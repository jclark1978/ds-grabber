<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FortiGate Side-by-Side Comparison</title>
<style>
  :root {
    --ftnt-red: #DA291C; --ftnt-red-dark: #B82217; --ftnt-black: #000000;
    --ftnt-white: #FFFFFF; --ftnt-light-grey: #F0F0F0; --ftnt-green: #3CB17E;
    --ftnt-text: #464646; --ftnt-text-2: #646464; --ftnt-text-3: #969696;
    --ftnt-border: #C8C8C8; --ftnt-zebra: #FAFAFA; --ftnt-red-t1: #FBE9E8; --ftnt-green-t1: #E2F3EC;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
         background: var(--ftnt-light-grey); color: var(--ftnt-text); font-size: 14px; line-height: 1.45; }
  header { background: var(--ftnt-white); border-bottom: 3px solid var(--ftnt-red); padding: 20px 32px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ftnt-red); }
  h1 { margin: 4px 0 2px; font-size: 26px; font-weight: 700; color: var(--ftnt-black); }
  .meta { color: var(--ftnt-text-2); font-size: 12px; }
  .toolbar { float: right; margin-top: 6px; display: flex; gap: 8px; }
  button { font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
  .btn-primary { background: var(--ftnt-red); color: #fff; border: 1px solid var(--ftnt-red); }
  .btn-primary:hover { background: var(--ftnt-red-dark); }
  .btn-secondary { background: #fff; color: var(--ftnt-text); border: 1px solid var(--ftnt-border); }
  main { max-width: 1180px; margin: 24px auto; padding: 0 24px 40px; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 20px 24px; margin-bottom: 20px; }
  .models { display: grid; gap: 16px; }
  .model { border: 1px solid var(--ftnt-border); border-radius: 0 12px 0 0; padding: 14px 16px; }
  .model .name { font-size: 17px; font-weight: 700; color: var(--ftnt-black); }
  .model .sub { font-size: 12px; color: var(--ftnt-text-2); margin: 2px 0 8px; }
  a { color: var(--ftnt-red); text-decoration: none; } a:hover { text-decoration: underline; }
  h2 { font-size: 16px; font-weight: 700; color: var(--ftnt-black); margin: 0 0 12px;
       padding-left: 10px; border-left: 4px solid var(--ftnt-red); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  th, td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid #E6E6E6; }
  thead th { background: var(--ftnt-light-grey); color: var(--ftnt-black); font-weight: 700; }
  tbody tr:nth-child(even) td { background: var(--ftnt-zebra); }
  td.spec { color: var(--ftnt-text); }
  td.val { font-variant-numeric: tabular-nums; }
  td.best { font-weight: 700; color: var(--ftnt-black); }
  td.missing { color: var(--ftnt-text-3); font-style: italic; }
  td.delta { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .up { background: var(--ftnt-green-t1); color: #1F7A52; }
  .down { background: var(--ftnt-red-t1); color: var(--ftnt-red-dark); }
  .same { background: var(--ftnt-light-grey); color: var(--ftnt-text-2); }
  sup { font-size: 9px; color: var(--ftnt-text-2); margin-left: 2px; }
  .notes h3 { font-size: 13px; margin: 14px 0 4px; color: var(--ftnt-black); }
  .notes ol, .notes ul { margin: 0; padding-left: 0; list-style: none; font-size: 12px; color: var(--ftnt-text-2); }
  .notes li { margin: 2px 0; } .notes li b { color: var(--ftnt-text); display: inline-block; min-width: 22px; }
  .callout { font-size: 12px; color: var(--ftnt-text-2); background: var(--ftnt-light-grey); border-radius: 6px; padding: 10px 12px; }
  .error { color: var(--ftnt-red-dark); font-weight: 600; }
  footer { font-size: 11px; color: var(--ftnt-text-3); text-align: center; margin-top: 8px; }
  @media print {
    body { background: #fff; font-size: 11px; }
    .toolbar { display: none; }
    main { margin: 0; max-width: none; padding: 0 12px; }
    .card { box-shadow: none; border: 1px solid #E6E6E6; break-inside: avoid; page-break-inside: avoid; }
    header { padding: 12px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    thead th, tbody tr:nth-child(even) td, .pill { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<header>
  <div class="toolbar">
    <button class="btn-secondary" onclick="exportCsv()">Export CSV</button>
    <button class="btn-primary" onclick="window.print()">Print / Save PDF</button>
  </div>
  <div class="eyebrow">FortiGate Comparison</div>
  <h1 id="title">Side-by-Side Comparison</h1>
  <div class="meta" id="meta"></div>
</header>
<main id="main"><div class="card">Loading…</div></main>
<footer>Specifications from Fortinet datasheets. All performance values are "up to" and vary with system configuration. Verify against the linked datasheet before quoting to a customer.</footer>

<!--
  DATA: paste a JSON array of model records from ds-grabber (data/models/<id>.json)
  between the script tags below, in the order they should appear. If left as [],
  the page loads models named in the URL instead: report.html?models=FG-90G,FG-120G
-->
<script id="ds-data" type="application/json">[]</script>

<script>
const DATA_BASE = "https://raw.githubusercontent.com/jclark1978/ds-grabber/main/";

// Rows to show, by section. dir: 1 = higher is better, -1 = lower is better, 0 = no ranking.
const SECTIONS = [
  { title: "Threat Protection Performance", rows: [
    ["threat_protection_throughput_mbps", "Threat Protection Throughput", "mbps", 1],
    ["ngfw_throughput_mbps", "NGFW Throughput", "mbps", 1],
    ["ips_throughput_mbps", "IPS Throughput", "mbps", 1],
    ["ssl_inspection_throughput_mbps", "SSL Inspection Throughput", "mbps", 1],
    ["ssl_inspection_cps", "SSL Inspection CPS", "count", 1],
    ["ssl_inspection_sessions", "SSL Inspection Concurrent Sessions", "count", 1],
    ["app_control_throughput_mbps", "Application Control Throughput", "mbps", 1],
  ]},
  { title: "Firewall Performance and Capacity", rows: [
    ["fw_throughput_1518_mbps", "Firewall Throughput (1518 byte UDP)", "mbps", 1],
    ["fw_throughput_512_mbps", "Firewall Throughput (512 byte UDP)", "mbps", 1],
    ["fw_throughput_64_mbps", "Firewall Throughput (64 byte UDP)", "mbps", 1],
    ["fw_latency_us", "Firewall Latency (64 byte UDP)", "us", -1],
    ["fw_pps", "Firewall Throughput (Packets per Second)", "pps", 1],
    ["concurrent_sessions", "Concurrent Sessions (TCP)", "count", 1],
    ["new_sessions_per_sec", "New Sessions per Second (TCP)", "count", 1],
    ["firewall_policies", "Firewall Policies", "count", 1],
  ]},
  { title: "VPN", rows: [
    ["ipsec_throughput_mbps", "IPsec VPN Throughput (512 byte)", "mbps", 1],
    ["ipsec_tunnels_g2g", "Gateway-to-Gateway IPsec Tunnels", "count", 1],
    ["ipsec_tunnels_c2g", "Client-to-Gateway IPsec Tunnels", "count", 1],
    ["ssl_vpn_throughput_mbps", "SSL VPN Throughput", "mbps", 1],
    ["ssl_vpn_users", "Concurrent SSL VPN Users", "count", 1],
  ]},
  { title: "Scale and Management", rows: [
    ["vdoms_default", "Virtual Domains (Default)", "count", 1],
    ["vdoms_max", "Virtual Domains (Maximum)", "count", 1],
    ["max_fortiswitches", "Maximum FortiSwitches", "count", 1],
    ["max_fortiaps_total", "Maximum FortiAPs (Total)", "count", 1],
    ["max_fortiaps_tunnel", "Maximum FortiAPs (Tunnel Mode)", "count", 1],
    ["max_fortitokens", "Maximum FortiTokens", "count", 1],
    ["max_registered_endpoints", "Maximum Registered Endpoints", "count", 1],
    ["capwap_throughput_mbps", "CAPWAP Throughput", "mbps", 1],
    ["ha_modes", "High Availability", "list", 0],
  ]},
];

const HW_ROWS = [
  ["interfaces", "Interfaces"], ["storage", "Storage"], ["rack_units", "Rack Units"],
  ["desktop", "Desktop Form Factor"], ["power_avg_w", "Power (Average, W)"], ["power_max_w", "Power (Maximum, W)"],
  ["heat_btu_h", "Heat Dissipation (BTU/h)"], ["redundant_psu", "Redundant Power Supplies"],
  ["weight_kg", "Weight (kg)"], ["tpm", "Trusted Platform Module"], ["ble", "Bluetooth Low Energy"],
];
const VM_ROWS = [["vcpu_min", "vCPU (Minimum)"], ["vcpu_max", "vCPU (Maximum)"], ["vm_storage", "Storage Support"], ["unlimited_users", "Unlimited User License"]];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = (v, d = 2) => Number(v).toLocaleString("en-US", { maximumFractionDigits: d });

function fmt(v, kind) {
  if (v === null || v === undefined) return null;
  if (kind === "mbps") return v >= 1000 ? `${num(v / 1000)} Gbps` : `${num(v)} Mbps`;
  if (kind === "us") return `${num(v)} μs`;
  if (kind === "pps") return v >= 1e6 ? `${num(v / 1e6)} Mpps` : `${num(v)} pps`;
  if (kind === "list") return Array.isArray(v) ? v.join(", ") : String(v);
  if (typeof v === "boolean") return v ? "Yes" : "No";
  if (typeof v === "number") return num(v);
  return String(v);
}

function rawNone(raw) { return raw !== undefined && /^\s*[—–-]?\s*(n\/?a|n\.a\.|none|not supported|tba|tbd)?\s*$/i.test(raw); }

async function loadModels() {
  const embedded = JSON.parse(document.getElementById("ds-data").textContent || "[]");
  if (embedded.length) return embedded;
  const wanted = (new URLSearchParams(location.search).get("models") || "").split(",").map(s => s.trim()).filter(Boolean);
  if (!wanted.length) throw new Error("No model data embedded and no ?models= list in the URL.");
  const index = await (await fetch(DATA_BASE + "data/index.json")).json();
  const norm = s => s.toUpperCase().replace(/FORTI\s*GATE|FORTI\s*WIFI|RUGGED|\bFGT\b|^FG-?|^FWF-?|^FGR-?|\s+/g, "").replace(/^-+/, "");
  const out = [];
  for (const w of wanted) {
    const hit = index.models.find(m => m.model_id.toUpperCase() === w.toUpperCase())
             || index.models.find(m => m.codes.includes(norm(w)));
    if (!hit) throw new Error(`Model not found in the datasheet index: ${w}`);
    out.push(await (await fetch(DATA_BASE + hit.file)).json());
  }
  return out;
}

function cell(m, key, kind) {
  const s = (m.specs || {})[key];
  if (!s) return { html: "Not listed", cls: "missing", v: null };
  let text = fmt(s.value, kind);
  if (text === null) text = rawNone(s.raw) ? (s.raw && /tba|tbd/i.test(s.raw) ? "TBA" : "Not supported / N/A") : esc(s.raw);
  const sup = (s.notes || []).length ? `<sup>${s.notes.map(esc).join(",")}</sup>` : "";
  return { html: esc(text) + sup, cls: "val", v: typeof s.value === "number" ? s.value : null };
}

function deltaPill(a, b, dir) {
  if (a === null || b === null || !dir || a === 0) return "";
  const pct = Math.round((b - a) / a * 100);
  if (a === b) return `<span class="pill same">same</span>`;
  const shown = Math.abs((b - a) / a * 100) < 1 ? ((b - a) / a * 100).toFixed(1) : pct;
  const better = (b > a) === (dir > 0);
  return `<span class="pill ${better ? "up" : "down"}">${b > a ? "+" : ""}${shown}%</span>`;
}

function specTable(models, rows) {
  const two = models.length === 2;
  let body = "";
  for (const [key, label, kind, dir] of rows) {
    if (!models.some(m => (m.specs || {})[key])) continue;
    const cells = models.map(m => cell(m, key, kind));
    const vals = cells.map(c => c.v).filter(v => v !== null);
    const best = dir && vals.length > 1 && new Set(vals).size > 1 ? (dir > 0 ? Math.max(...vals) : Math.min(...vals)) : null;
    body += `<tr><td class="spec">${esc(label)}</td>` +
      cells.map(c => `<td class="${c.cls}${best !== null && c.v === best ? " best" : ""}">${c.html}</td>`).join("") +
      (two ? `<td class="delta">${deltaPill(cells[0].v, cells[1].v, dir)}</td>` : "") + "</tr>";
  }
  return body;
}

function sideTable(models, rows, block) {
  let body = "";
  for (const [key, label] of rows) {
    if (!models.some(m => m[block] && m[block][key] !== undefined && m[block][key] !== null)) continue;
    body += `<tr><td class="spec">${esc(label)}</td>` + models.map(m => {
      const v = m[block] ? m[block][key] : undefined;
      if (v === undefined || v === null) return `<td class="missing">Not listed</td>`;
      if (key === "interfaces") return `<td class="val">${v.filter(i => i.count).map(i => `${esc(i.raw)} × ${esc(i.type)}`).join("<br>") || "None listed"}</td>`;
      const t = fmt(v);
      return `<td class="val">${esc(/^[—–-]$/.test(t) ? "None" : t)}</td>`;
    }).join("") + (models.length === 2 ? "<td></td>" : "") + "</tr>";
  }
  return body;
}

function render(models) {
  const names = models.map(m => m.model);
  document.getElementById("title").textContent = names.join(" vs ");
  document.title = names.join(" vs ") + " | FortiGate Comparison";
  document.getElementById("meta").textContent =
    `Generated ${new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })} from Fortinet datasheets`;
  const two = models.length === 2;
  const specW = 26, deltaW = two ? 14 : 0, colW = (100 - specW - deltaW) / models.length;
  const cols = `<colgroup><col style="width:${specW}%">${models.map(() => `<col style="width:${colW}%">`).join("")}${two ? `<col style="width:${deltaW}%">` : ""}</colgroup>`;
  const head = cols + `<thead><tr><th>Specification</th>${names.map(n => `<th>${esc(n)}</th>`).join("")}${two ? `<th>${esc(names[1])} vs ${esc(names[0])}</th>` : ""}</tr></thead>`;

  let html = `<div class="card"><div class="models" style="grid-template-columns: repeat(${models.length}, 1fr)">` +
    models.map(m => `<div class="model"><div class="name">${esc(m.model)}</div>
      <div class="sub">${m.form_factor === "vm" ? "Virtual appliance" : "Hardware appliance"} · ${esc(m.model_id)}</div>
      <div><a href="${esc(m.source.spec_url || m.source.url)}" target="_blank" rel="noopener">Open datasheet (spec page)</a></div>
      <div class="sub" style="margin-top:6px">${esc(m.source.title || "")}${m.source.library_last_updated ? ` · Fortinet library date ${esc(m.source.library_last_updated)}` : ""}</div></div>`).join("") +
    `</div></div>`;

  if (models.some(m => m.form_factor === "vm") && models.some(m => m.form_factor !== "vm")) {
    html += `<div class="card callout">Hardware and VM comparison: the FortiGate VM datasheet lists capacity only, not throughput. Throughput for a VM depends on the hypervisor or cloud instance; see the per-platform VM datasheets.</div>`;
  }
  for (const sec of SECTIONS) {
    const body = specTable(models, sec.rows);
    if (body) html += `<div class="card"><h2>${esc(sec.title)}</h2><table>${head}<tbody>${body}</tbody></table></div>`;
  }
  const hw = sideTable(models, HW_ROWS, "hardware");
  if (hw) html += `<div class="card"><h2>Hardware</h2><table>${head}<tbody>${hw}</tbody></table></div>`;
  const vm = sideTable(models, VM_ROWS, "vm");
  if (vm) html += `<div class="card"><h2>Virtual Appliance</h2><table>${head}<tbody>${vm}</tbody></table></div>`;

  html += `<div class="card notes"><h2>Test Conditions and Sources</h2>` + models.map(m => {
    const fn = Object.entries(m.footnotes || {});
    const note = (m.footnotes || {}).note;
    return `<h3>${esc(m.model)}: <a href="${esc(m.source.spec_url || m.source.url)}" target="_blank" rel="noopener">${esc(m.source.title || "Datasheet")}</a></h3>` +
      (note ? `<div style="font-size:12px;margin-bottom:4px">${esc(note)}</div>` : "") +
      `<ul>${fn.filter(([k]) => k !== "note").map(([k, v]) => `<li><b>${esc(k)}</b>${esc(v)}</li>`).join("")}</ul>`;
  }).join("") + `</div>`;
  document.getElementById("main").innerHTML = html;
  window.__models = models;
}

function exportCsv() {
  const models = window.__models || [];
  const rows = [["Specification", ...models.map(m => m.model)]];
  for (const sec of SECTIONS) for (const [key, label, kind] of sec.rows) {
    if (!models.some(m => (m.specs || {})[key])) continue;
    rows.push([label, ...models.map(m => { const s = (m.specs || {})[key]; return s ? (fmt(s.value, kind) ?? s.raw) : ""; })]);
  }
  rows.push(["Datasheet", ...models.map(m => m.source.spec_url || m.source.url)]);
  const csv = rows.map(r => r.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "fortigate-comparison.csv";
  a.click();
}

loadModels().then(render).catch(e => {
  document.getElementById("main").innerHTML = `<div class="card error">${esc(e.message)}</div>`;
});
</script>
</body>
</html>
